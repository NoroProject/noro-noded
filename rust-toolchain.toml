# Версия тулчейна закреплена намеренно.
#
# CI гоняет clippy с `-D warnings`. На плавающем stable это значит, что выход
# новой версии Rust красит сборку без единого изменения в коде: каждый релиз
# приносит новые линты. Так уже случилось дважды за один день — на машине
# разработчика был 1.94, на раннере 1.97, и они расходились в наборе проверок.
#
# Обновлять версию здесь отдельным коммитом, вместе с правкой того, что найдёт
# новый clippy.
#
# Локально это работает только через rustup: если `rustc` подхватывается из
# Homebrew, файл игнорируется и расхождение с CI останется.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
